name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  js:
    name: JS (eslint, typecheck, unit tests, web build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint typecheck test build

  program:
    name: Program (fmt, anchor build, clippy, LiteSVM tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Cache Solana toolchain and Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/solana
            ~/.config/solana
            ~/.cache/solana
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: program-${{ runner.os }}-${{ hashFiles('scripts/bootstrap.sh', 'Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: program-${{ runner.os }}-
      - name: Install pinned Agave and Anchor
        run: BOOTSTRAP_SKIP_VERIFY=1 scripts/bootstrap.sh
      - name: Put Agave on PATH
        run: echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - run: scripts/rust-checks.sh
