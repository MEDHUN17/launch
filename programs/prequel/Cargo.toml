[package]
name = "prequel"
version = "0.1.0"
description = "Prequel: event-conditional memecoin launchpad (Phase 0 stub)"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "prequel"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = { version = "1.2.2", features = ["init-if-needed"] }
# Anchor 1.2.2 no longer re-exports these; both are official Solana SDK crates already in the dependency graph.
# Versions match anchor-lang's default `solana-v3` compatibility set.
solana-sha256-hasher = { version = "3", features = ["sha2"] }
solana-instructions-sysvar = "3"

[dev-dependencies]
# Cargo.lock pins LiteSVM's Rust-1.89-compatible dependency graph.
litesvm = { version = "0.15.0", features = ["precompiles"] }
solana-message = "4"
solana-transaction = "4"
solana-signer = "3"
solana-keypair = "3"
solana-account = "4"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
