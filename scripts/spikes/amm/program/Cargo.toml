[package]
name = "amm_spike"
version = "0.0.0"
description = "Phase 0 spike: Meteora DAMM v2 pool creation, permanent lock and fee claim by CPI from PDAs"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "amm_spike"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.2.2"
# declare_program! emits bytemuck derives for the AMM's zero-copy accounts
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }

[dev-dependencies]
litesvm = "0.15.0"
solana-message = "4"
solana-transaction = "4"
solana-signer = "3"
solana-keypair = "3"
serde_json = "1"
solana-account = "4"
base64 = "0.22"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
